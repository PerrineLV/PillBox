version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Les mises à jour de version sont d'abord validées sur dev. GitHub continue
    # de cibler la branche par défaut pour les correctifs de sécurité.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    # Garder une seule mise à jour de version npm en revue à la fois.
    open-pull-requests-limit: 1
    groups:
      production-runtime:
        dependency-type: production
        patterns:
          - '*'
        exclude-patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      development-tools:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
    ignore:
      # Les versions d'Expo, de React, de React Native et des modules natifs sont
      # imposées par le SDK Expo 54, pas choisies dépendance par dépendance. Même
      # un correctif proposé isolément par Dependabot sortirait de l'ensemble
      # validé par Expo : ces paquets sont donc entièrement exclus des mises à
      # jour de version. Ils évoluent uniquement par un ticket de migration de
      # SDK, avec les versions rendues par `expo install` et un essai sur le
      # téléphone Android cible. La CI exécute `expo install --check` pour
      # détecter tout écart introduit malgré tout.
      - dependency-name: expo
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: 'expo-*'
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@expo/*'
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native-safe-area-context
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-native-screens
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: '@react-native-community/datetimepicker'
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major

      # better-sqlite3 n'est utilisée que par les tests Node ; ses correctifs
      # restent proposés, mais ses montées mineures ou majeures demandent un
      # ticket dédié.
      - dependency-name: better-sqlite3
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

      # Les montées majeures de la chaîne de développement sont traitées dans un
      # ticket technique séparé plutôt que dans une mise à jour groupée.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: jest
        update-types:
          - version-update:semver-major
      - dependency-name: jest-expo
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-expo
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
