version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      expo-runtime:
        patterns:
          - 'expo*'
          - '@expo/*'
      production-runtime:
        dependency-type: production
        patterns:
          - '*'
      development-tools:
        dependency-type: development
        patterns:
          - '*'
    ignore:
      # Expo SDK 54 utilise encore la chaîne ESLint 9. Une mise à jour majeure
      # isolée vers ESLint 10 fait échouer `expo lint` avant l'analyse du code.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
