name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # This managed Expo project has no native android/ directory yet.
      # Exporting the Android bundle is the closest reproducible build check available.
      - name: Verify Android bundle
        run: npm run build:android:check
