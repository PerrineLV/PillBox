name: Android release APK

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Generate native Android project
        run: npm run android:release:prebuild

      - name: Prepare and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npm run android:release:prepare-signing

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npm run android:release:build

      - name: Verify APK signature
        run: npm run android:release:verify

      - name: Prepare stable APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          readonly apk_source="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_source"
          mkdir -p release
          cp "$apk_source" release/pillbox-latest.apk
          cd release
          sha256sum pillbox-latest.apk > pillbox-latest.apk.sha256
          test -s pillbox-latest.apk.sha256
          sha256sum --check pillbox-latest.apk.sha256

      - name: Remove generated signing material
        if: always()
        shell: bash
        run: rm -f android/app/release.keystore

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pillbox-apk-${{ github.sha }}
          path: |
            release/pillbox-latest.apk
            release/pillbox-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false

  publish-release:
    name: Publish GitHub Release
    needs: release-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: android-build-${{ github.run_number }}

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pillbox-apk-${{ github.sha }}
          path: release

      - name: Refuse to replace an existing release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi

      - name: Verify downloaded APK checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s release/pillbox-latest.apk
          test -s release/pillbox-latest.apk.sha256
          cd release
          sha256sum --check pillbox-latest.apk.sha256

      - name: Publish APK and checksum in GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            release/pillbox-latest.apk \
            release/pillbox-latest.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PillBox Android build $GITHUB_RUN_NUMBER" \
            --notes "APK Android release signé pour le commit $GITHUB_SHA." \
            --latest
