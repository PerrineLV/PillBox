name: Android release APK

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Une release en cours n'est jamais interrompue. GitHub conserve uniquement le
# push main le plus récent encore en attente dans ce groupe de concurrence.
concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release-apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      app-version: ${{ steps.app-version.outputs.value }}
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Resolve published application version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm run --silent app:version)"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "Version publiée : $version (versionCode $ANDROID_VERSION_CODE)"

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Generate native Android project
        run: npm run android:release:prebuild

      # Le versionName Android et le tag GitHub doivent décrire la même version.
      - name: Check Android version metadata
        shell: bash
        env:
          APP_VERSION: ${{ steps.app-version.outputs.value }}
        run: |
          set -euo pipefail
          grep -Fq "versionName \"$APP_VERSION\"" android/app/build.gradle
          grep -Fq "versionCode $ANDROID_VERSION_CODE" android/app/build.gradle

      - name: Prepare and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npm run android:release:prepare-signing

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npm run android:release:build

      - name: Verify APK signature
        run: npm run android:release:verify

      - name: Prepare stable APK and SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          readonly apk_source="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_source"
          mkdir -p release
          cp "$apk_source" release/pillbox-latest.apk
          cd release
          sha256sum pillbox-latest.apk > pillbox-latest.apk.sha256
          test -s pillbox-latest.apk.sha256
          sha256sum --check pillbox-latest.apk.sha256

      - name: Remove generated signing material
        if: always()
        shell: bash
        run: rm -f android/app/release.keystore

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pillbox-apk-${{ github.sha }}
          path: |
            release/pillbox-latest.apk
            release/pillbox-latest.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false

  publish-release:
    name: Publish GitHub Release
    needs: release-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Le tag porte la version publiée : `v<MAJEUR.MINEUR.versionCode>`. Le
      # versionCode étant le numéro de run, un re-run publie le même tag pour le
      # même commit et reste donc idempotent.
      APP_VERSION: ${{ needs.release-apk.outputs.app-version }}
      RELEASE_TAG: v${{ needs.release-apk.outputs.app-version }}

    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pillbox-apk-${{ github.sha }}
          path: release

      - name: Verify downloaded APK checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s release/pillbox-latest.apk
          test -s release/pillbox-latest.apk.sha256
          cd release
          sha256sum --check pillbox-latest.apk.sha256

      - name: Publish or verify the commit release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version publiée invalide : « $APP_VERSION »." >&2
            exit 1
          fi

          readonly apk_name="pillbox-latest.apk"
          readonly checksum_name="pillbox-latest.apk.sha256"
          readonly apk_path="release/$apk_name"
          readonly checksum_path="release/$checksum_name"
          readonly release_title="PillBox $APP_VERSION"
          readonly release_notes="APK Android release signé pour le commit $GITHUB_SHA."
          readonly temporary_directory="$(mktemp -d)"
          readonly existing_directory="$temporary_directory/existing"
          readonly verification_directory="$temporary_directory/verification"
          readonly release_error="$temporary_directory/release-view-error.log"
          readonly latest_error="$temporary_directory/latest-release-error.log"

          cleanup() {
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT

          release_exists=false
          should_mark_latest=false

          if latest_tag="$(
            gh release view \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName \
              --jq '.tagName' \
              2>"$latest_error"
          )"; then
            if [[ "$latest_tag" == "$RELEASE_TAG" ]]; then
              latest_target="$GITHUB_SHA"
            else
              latest_target="$(
                gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$latest_tag" \
                  --jq '.object.sha'
              )"
              comparison_status="$(
                gh api "repos/$GITHUB_REPOSITORY/compare/$latest_target...$GITHUB_SHA" \
                  --jq '.status'
              )"

              case "$comparison_status" in
                ahead)
                  should_mark_latest=true
                  ;;
                behind | identical)
                  ;;
                *)
                  echo "Le SHA $GITHUB_SHA diverge de la dernière release $latest_target." >&2
                  exit 1
                  ;;
              esac
            fi
          elif grep -Eqi 'release not found|no published releases' "$latest_error"; then
            latest_tag=''
            should_mark_latest=true
          else
            cat "$latest_error" >&2
            exit 1
          fi

          if release_target="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish \
              --jq '.targetCommitish' \
              2>"$release_error"
          )"; then
            release_exists=true
          elif grep -Fqi 'release not found' "$release_error"; then
            release_target=''
          else
            cat "$release_error" >&2
            exit 1
          fi

          if [[ "$release_exists" == true ]]; then
            if [[ "$release_target" != "$GITHUB_SHA" ]]; then
              echo "Release $RELEASE_TAG cible $release_target au lieu de $GITHUB_SHA." >&2
              exit 1
            fi

            tag_target="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
                --jq '.object.sha'
            )"
            if [[ "$tag_target" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG cible $tag_target au lieu de $GITHUB_SHA." >&2
              exit 1
            fi

            mkdir -p "$existing_directory"
            existing_assets=()
            missing_assets=()

            for asset_name in "$apk_name" "$checksum_name"; do
              if gh release view "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[].name' | grep -Fxq "$asset_name"; then
                gh release download "$RELEASE_TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern "$asset_name" \
                  --dir "$existing_directory"
                existing_assets+=("$asset_name")
              else
                missing_assets+=("release/$asset_name")
              fi
            done

            if (( ${#missing_assets[@]} > 0 )); then
              for asset_name in "${existing_assets[@]}"; do
                if ! cmp -s "release/$asset_name" "$existing_directory/$asset_name"; then
                  echo "Asset existant $asset_name différent : publication refusée." >&2
                  exit 1
                fi
              done

              gh release upload "$RELEASE_TAG" "${missing_assets[@]}" \
                --repo "$GITHUB_REPOSITORY"
            else
              (
                cd "$existing_directory"
                sha256sum --check "$checksum_name"
              )
              echo "Release $RELEASE_TAG déjà complète et identique ; aucune modification."
            fi
          else
            gh release create "$RELEASE_TAG" \
              "$apk_path" \
              "$checksum_path" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "$release_notes" \
              --latest=false
          fi

          if [[ "$release_exists" == false ]] || (( ${#missing_assets[@]} > 0 )); then
            mkdir -p "$verification_directory"
            for asset_name in "$apk_name" "$checksum_name"; do
              gh release download "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset_name" \
                --dir "$verification_directory"

              if ! cmp -s "release/$asset_name" "$verification_directory/$asset_name"; then
                echo "Asset publié $asset_name différent du build courant." >&2
                exit 1
              fi
            done

            (
              cd "$verification_directory"
              sha256sum --check "$checksum_name"
            )
          fi

          if [[ "$should_mark_latest" == true ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          fi
